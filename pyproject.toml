[project]
name = "plaintext-sims"
version = "0.1.0"
description = "Computational experiments for 'The Plaintext Statistician'"
authors = [{ name = "Nan Xiao", email = "me@nanx.me" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
