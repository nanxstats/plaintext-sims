[project]
name = "plaintext-sims"
version = "0.1.0"
description = "Computational experiments for 'The Plaintext Statistician'"
authors = [{ name = "Nan Xiao", email = "me@nanx.me" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = []

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
